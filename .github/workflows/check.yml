name: Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    name: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Skips the Vitest files that sign in to the shared Supabase project.
      # Local `pnpm test` still runs them when web/.env is present.
      - run: pnpm test
        env:
          CHECK_SKIP_LIVE_SUPABASE: '1'
      - run: pnpm benchmark
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-shield-benchmark
          path: web/benchmark/results/

  ml-demo:
    name: ml-demo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: AI/requirements.txt
      - run: python -m pip install -r AI/requirements.txt
      - run: python -m unittest discover -s AI/tests
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: web
      - run: pnpm exec playwright test --config playwright.ml.config.ts
        working-directory: web

  # No AWS credential: the organisation denies OIDC providers, so CI checks the
  # Terraform against a mock provider and the account owner applies it.
  infrastructure:
    name: infrastructure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.2
      - run: terraform fmt -check -recursive infra
      - name: Validate and test the sandbox stack
        working-directory: infra/sandbox
        run: |
          terraform init -backend=false -input=false
          terraform validate
          terraform test

  migrations:
    name: migrations
    runs-on: ubuntu-latest
    # The dry-run also rotates the temporary DB login password.
    concurrency:
      group: shared-supabase-migrations
      queue: max
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      # Asks the shared project whether these files would apply. Does not write.
      # --include-all: rename_for_loop_to_loops was never recorded, and its
      # timestamp is older than migrations already on the project.
      - name: Dry-run pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db push --dry-run --include-all --project-ref nopyjjyimtmvuucsirxb --yes
